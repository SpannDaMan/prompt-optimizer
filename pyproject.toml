[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimizer"
version = "0.1.7"
description = "Turn long prompts into clear execution briefs without losing requirements or widening scope"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Orbral"}]
keywords = ["long-prompts", "prompt-optimization", "prompt-engineering", "requirements", "scope-drift", "agent-briefs", "codex", "claude-code"]
dependencies = []

[project.urls]
Homepage = "https://github.com/SpannDaMan/prompt-optimizer"
Repository = "https://github.com/SpannDaMan/prompt-optimizer"
Issues = "https://github.com/SpannDaMan/prompt-optimizer/issues"

[project.scripts]
prompt-optimizer = "prompt_optimizer:main"

[tool.setuptools]
py-modules = ["prompt_optimizer"]
package-dir = {"" = "plugins/prompt-optimizer/scripts"}

[tool.pytest.ini_options]
testpaths = ["tests"]
