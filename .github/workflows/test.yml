name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Run one-command demo
        run: python -B tools/demo.py
      - name: Run deterministic prompt-packet evals
        run: python -B tools/run_evals.py
      - name: Validate the example against the public JSON Schema
        run: python -B tools/validate_json_schema.py --schema plugins/prompt-optimizer/brief.schema.json --instance plugins/prompt-optimizer/examples/optimized-brief.json
      - name: Validate release shape
        run: python -B tools/validate_release_candidate.py --json
      - name: Build and install package
        run: python -m pip install .
      - name: Smoke installed CLI
        run: |
          prompt-optimizer --version
          prompt-optimizer trace --prompt-file plugins/prompt-optimizer/examples/long-request.txt --brief-file plugins/prompt-optimizer/examples/optimized-brief.json
