name: Bug report
description: Report a reproducible Prompt Optimizer defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Redact prompts and briefs before posting. Never include credentials, customer data, or private repository content.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: prompt-optimizer 0.1.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and exit code
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal redacted reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
